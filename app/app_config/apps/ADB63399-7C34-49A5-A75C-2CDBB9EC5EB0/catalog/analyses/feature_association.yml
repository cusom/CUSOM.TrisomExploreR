# defines supported features, execution behavior, and analysis capabilities.
id: feature_association

display_name: Feature Association

description: >
  Evaluate the association between a selected biological or clinical feature
  and analyte abundance across one or more experiments.

version: 1.0

category: Differential Analysis

icon: feature_association

enabled: true

features:
  karyotype:
    datasets:
    - MSD_P4C_09012019
    - HTP_NULISA_2025_v1_APOE4
    - HTP_SomaScan11k_2025_core
    - X01_2024_HTP_OLINK_core

  age:
    datasets:
    - MSD_P4C_09012019
    - HTP_NULISA_2025_v1_APOE4
    - HTP_SomaScan11k_2025_core
    - X01_2024_HTP_OLINK_core
  sex:
    datasets:
    - MSD_P4C_09012019
    - HTP_NULISA_2025_v1_APOE4
    - HTP_SomaScan11k_2025_core

  bmi:
    datasets:
    - MSD_P4C_09012019
    - HTP_NULISA_2025_v1_APOE4
    - HTP_SomaScan11k_2025_core

  comorbidity:
    datasets:
    - MSD_P4C_09012019
    - HTP_NULISA_2025_v1_APOE4
    - HTP_SomaScan11k_2025_core


supported_statistics:
  source: package

supports:

  filtering: true

  covariates: true

  subgroup_analysis: true

  multiple_testing_correction: true

  precalculated_statistics: true

  generated_statistics: true

default_outputs:

  summary_plot: volcano

  drilldown_plot: boxplot

planner:

  feature_source: feature_registry

  dataset_source: dataset_registry

  statistic_source: package

  feature_dimension: feature_definition

  measurement_source: package

execution:

  strategy: feature_association

  drilldown: analyte_measurements

tags:
  - differential
  - feature
  - statistics

